services:
  postgres:
    image: postgres:17
    container_name: virtual_library
    environment:
      POSTGRES_DB: virtual_library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - virtual-library-data:/var/lib/postgresql/data

volumes:
  virtual-library-data:
