spring.application.name=virtual-library
spring.datasource.url=jdbc:postgresql://localhost:5432/virtual_library
spring.datasource.username=postgres
spring.datasource.password=admin123

# Configurações do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configurar o Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

api.security.token.secret=${JWT_SECRET:defaultSecretKey}
external.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
